# ═══════════════════════════════════════════════════════════════════════════
# NPM PUBLISH WORKFLOW
# ═══════════════════════════════════════════════════════════════════════════
#
# Automatically publishes to npm when a version tag is pushed.
#
# To trigger:
#   1. Update version in package.json
#   2. Commit: git commit -am "Release v0.2.0"
#   3. Tag: git tag v0.2.0
#   4. Push: git push origin main --tags
#
# Requirements:
#   - NPM_TOKEN secret configured in repository settings
#   - Repository has id-token: write permission for provenance
#
# ═══════════════════════════════════════════════════════════════════════════

name: Publish to npm

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v0.1.0, v1.0.0, etc.

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # TEST JOB
  # ─────────────────────────────────────────────────────────────────────────
  # Run tests before publishing
  # ─────────────────────────────────────────────────────────────────────────

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  # ─────────────────────────────────────────────────────────────────────────
  # PUBLISH JOB
  # ─────────────────────────────────────────────────────────────────────────
  # Publish to npm with provenance
  # ─────────────────────────────────────────────────────────────────────────

  publish:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required for GitHub Release SBOM attachment
      id-token: write # Required for npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # ─────────────────────────────────────────────────────────────────────
      # PUBLISH
      # ─────────────────────────────────────────────────────────────────────
      # --access public: Publish as public package
      # --provenance: Include build provenance (requires id-token permission)
      # ─────────────────────────────────────────────────────────────────────

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ─────────────────────────────────────────────────────────────────────
      # DATABASE ARTIFACT
      # ─────────────────────────────────────────────────────────────────────
      # Build DB from seeds, compress, and upload to GitHub Release.
      # Downstream Docker builds use scripts/download-db.sh to fetch this
      # instead of re-running slow BWB API ingestion.
      # ─────────────────────────────────────────────────────────────────────

      - name: Build database from seeds
        run: npm run build:db

      - name: Compress database
        run: gzip -k data/database.db

      - name: Build free-tier database
        run: npm run build:db:free
        continue-on-error: true

      - name: Compress free-tier database
        run: |
          if [ -f data/database-free.db ]; then
            gzip -k data/database-free.db
          fi

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom.cdx.json
            data/database.db.gz
            data/database-free.db.gz
          append_body: true
          body: |
            ### Artifacts
            - `database.db.gz` — Full SQLite database (download for Docker builds)
            - `database-free.db.gz` — Free-tier database (for Vercel deployment)
            - `sbom.cdx.json` — CycloneDX SBOM

  # ─────────────────────────────────────────────────────────────────────────
  # DOCKER JOB (OPTIONAL)
  # ─────────────────────────────────────────────────────────────────────────
