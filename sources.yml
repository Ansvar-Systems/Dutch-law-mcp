# sources.yml — Data provenance metadata
# Reference: docs/mcp-infrastructure-blueprint.md §3

schema_version: '1.0'
mcp_name: 'Dutch Law MCP'
jurisdiction: 'NL'

sources:
  - name: 'Wetten.overheid.nl'
    authority: 'Dutch Government (Overheid.nl)'
    official_portal: 'https://wetten.overheid.nl'
    canonical_identifier: 'ELI (European Legislation Identifier)'
    retrieval_method: 'XML_DOWNLOAD'
    api_documentation: 'https://www.overheid.nl/help/api'
    update_frequency: 'daily'
    last_ingested: '2026-02-10'
    license_or_terms:
      type: 'Government Open Data (CC0)'
      url: 'https://data.overheid.nl/licenties'
      summary: 'Dutch government open data, free to use without restrictions'
    coverage:
      scope: 'All consolidated Dutch statutes, AMvBs, ministerial regulations'
      limitations: 'Historical versions before 2002 may be incomplete'
    languages:
      - 'nl'

  - name: 'Rechtspraak.nl'
    authority: 'De Rechtspraak (Dutch Judiciary)'
    official_portal: 'https://uitspraken.rechtspraak.nl'
    canonical_identifier: 'ECLI (European Case Law Identifier)'
    retrieval_method: 'API'
    api_documentation: 'https://www.rechtspraak.nl/Uitspraken/paginas/open-data.aspx'
    update_frequency: 'daily'
    last_ingested: '2026-02-10'
    license_or_terms:
      type: 'Open Justice Data'
      url: 'https://www.rechtspraak.nl/Uitspraken/paginas/open-data.aspx'
      summary: 'Court decisions are public, free to reuse with ECLI citation'
    coverage:
      scope: 'Published court decisions from all Dutch courts (202K+ decisions)'
      limitations: 'Not all decisions are published; family law cases partially redacted'
    languages:
      - 'nl'

  - name: 'EUR-Lex'
    authority: 'European Union (Publications Office)'
    official_portal: 'https://eur-lex.europa.eu'
    canonical_identifier: 'CELEX (European legislation identifier)'
    retrieval_method: 'SPARQL + REST API'
    api_documentation: 'https://eur-lex.europa.eu/content/tools/webservices/SearchWebServiceUserManual_v2.00.pdf'
    update_frequency: 'manual'
    last_ingested: '2026-02-10'
    license_or_terms:
      type: 'EU Open Data (Decision 2011/833/EU)'
      url: 'https://eur-lex.europa.eu/content/legal-notice/legal-notice.html'
      summary: 'EU legislation is public domain; reuse encouraged with source attribution'
    coverage:
      scope: 'EU directives and regulations referenced by Dutch statutes (1,008 documents)'
      limitations: 'Metadata only — full text not stored; links to EUR-Lex for full content'
    languages:
      - 'nl'
      - 'en'

data_freshness:
  automated_checks: true
  check_frequency: 'daily'
  last_verified: '2026-02-14'

# Fix-Sweep rebuild contract (chassis corpus freshness automation, 2026-06-10 survey).
# Schema: Ansvar-Architecture-Documentation/infrastructure/policy/rebuild-contract.schema.json
# Runbook: Ansvar-Architecture-Documentation/docs/runbooks/fix-sweep.md
#
# ingest_cmd is the FULL freshness sweep: discovery refresh (newest-toestand
# selection, refetch on changed/unprovable freshness) PLUS the per-id backfill
# of the ~1,170 documents invisible to dcterms.type=wet discovery
# (data/backfill-ids.txt). `npm run ingest` alone is additive-only and must
# never be used as a staleness repair — it skips every existing seed.
#
# PRECONDITIONS for a fix-sweep run on this repo:
#   - data/seed/ must be populated (not committed to git; build_cmd fails loud
#     on an empty seed dir rather than building a 0-document database).
#   - TIMEOUT: fix-sweep's default FIX_SWEEP_BUILD_TIMEOUT (1800s) is too low
#     for EVERY sweep of this repo, not just the first. Steady state alone is
#     ~480 discovery pages plus ~1,170 per-id backfill resolutions at a 2s
#     rate limit ≈ 60-90 min even when everything is current. Set
#     FIX_SWEEP_BUILD_TIMEOUT=10800 for this repo. The first sweep after
#     2026-06-10 additionally refetches the FULL corpus (pre-toestand stamps
#     self-heal as refetch_unknown): budget several hours more.
rebuild_contract:
  schema_version: '1.0'
  runnable: true
  ingest_cmd: 'npm run ingest:sweep'
  build_cmd: 'npm run build:db'
  build_cwd: '.'
  premium_build_cmd: 'npm run build:db:paid'
  output_db: 'data/database.db'
  schema_kind: 'statute'
  drift_cmd: 'npm run drift:detect'
  golden_hashes: 'fixtures/golden-hashes.json'
  node_version: '22'
